{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-4xl md:text-5xl font-black mb-10 text-center text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400 uppercase tracking-tight">
        Master Codex
    </h1>
    
    <div class="grid gap-6">
        {% for record in terms %}
        <div class="bg-gray-900 border-l-4 border-red-500 rounded-r-xl p-6 shadow-md hover:bg-gray-800 transition-colors duration-300">
            <h2 class="text-2xl font-bold text-gray-100 mb-3">{{ record.term }}</h2>
            <p class="text-gray-400 leading-relaxed text-sm md:text-base">{{ record.definition }}</p>
        </div>
        {% empty %}
        <div class="text-center py-20 border border-dashed border-gray-800 rounded-xl">
            <p class="text-xl text-gray-500 font-bold italic">The Codex registry is currently empty.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
